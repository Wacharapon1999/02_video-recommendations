<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิดีโอแนะนำ | RM &amp; CG Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:8px;background:transparent}
.rmv,.rmv *{box-sizing:border-box}
.rmv{--green:#007947;--ink:#163e30;--muted:#697b73;font-family:'Figtree','Kanit',sans-serif;color:var(--ink);width:100%;max-width:1400px;margin:auto}
.rmv__header{display:flex;align-items:center;gap:11px;margin:0 0 18px}
.rmv__icon{width:33px;height:33px;flex-shrink:0;color:var(--green)}
.rmv h2{margin:0;font-size:24px;font-weight:600;line-height:1.35;color:var(--green)}
.rmv__intro{margin:4px 0 0;font-size:14px;font-weight:300;color:var(--muted)}
.rmv__layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:18px;align-items:start}
.rmv__featured{min-width:0;overflow:hidden;border-radius:12px;border:1px solid #dfeae4;background:#fff}
.rmv__screen{aspect-ratio:16/9;position:relative;background:#102b20}
.rmv__screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rmv__caption{padding:15px 18px;background:linear-gradient(100deg,#f0f8f3,#fff)}
.rmv__eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:5px}
.rmv__dot{width:6px;height:6px;background:var(--green);border-radius:50%}
.rmv h3{margin:0;font-size:19px;font-weight:500;line-height:1.45}
.rmv__description{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.6;font-weight:300}
.rmv__list-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:14px;font-weight:500}
.rmv__count{color:var(--muted);font-size:12px;font-weight:400}
.rmv__list{display:grid;gap:9px;list-style:none;margin:0;padding:0}
.rmv__item{display:grid;grid-template-columns:108px minmax(0,1fr) 16px;gap:12px;align-items:center;width:100%;padding:8px;text-align:left;color:var(--ink);border:1px solid #e0ebe5;border-radius:10px;background:white;font:inherit;cursor:pointer;transition:background .18s,border-color .18s}
.rmv__item:hover{background:#f3faf6;border-color:#9acbb1}
.rmv__item[aria-current="true"]{background:#eaf6ef;border-color:var(--green);box-shadow:inset 3px 0 var(--green)}
.rmv__item:focus-visible{outline:3px solid #007947;outline-offset:3px}
.rmv__thumb{position:relative;display:grid;place-items:center;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:radial-gradient(circle at 90% 10%,#5eb88e55,transparent 60%),linear-gradient(135deg,#0e5d3e,#103d30);color:white}
.rmv__thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rmv__play{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;background:#ffffff20;border:1px solid #ffffffa0;border-radius:50%;backdrop-filter:blur(3px)}
.rmv__play svg{width:12px;height:12px;margin-left:2px}
.rmv__number{position:absolute;bottom:3px;right:5px;font-size:10px;opacity:.8}
.rmv__title{display:block;font-size:14px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.rmv__status{display:block;font-size:11px;margin-top:5px;color:var(--muted)}
.rmv__item[aria-current="true"] .rmv__status{color:var(--green)}
.rmv__arrow{font-size:20px;color:var(--green)}
@media(min-width:1100px){.rmv__item{grid-template-columns:135px minmax(0,1fr) 16px}.rmv__title{font-size:15px}}
@media(max-width:740px){.rmv__layout{grid-template-columns:1fr}.rmv__list{grid-template-columns:repeat(2,minmax(0,1fr))}.rmv__item{grid-template-columns:85px minmax(0,1fr);gap:9px}.rmv__arrow{display:none}.rmv h2{font-size:22px}}
@media(max-width:440px){.rmv__list{grid-template-columns:1fr}.rmv__item{grid-template-columns:108px minmax(0,1fr) 16px}.rmv__arrow{display:block}}
@media(prefers-reduced-motion:reduce){.rmv__item{transition:none}}
</style>
</head>
<body>
<section class="rmv" aria-labelledby="rmv-heading">
  <header class="rmv__header">
    <svg class="rmv__icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="5" width="30" height="22" rx="8" fill="currentColor"/><path d="m13 11 9 5-9 5z" fill="white"/></svg>
    <div><h2 id="rmv-heading">วิดีโอแนะนำ</h2><p class="rmv__intro">เรียนรู้เรื่อง RM &amp; CG ผ่านสื่อวิดีโอเข้าใจง่าย</p></div>
  </header>
  <div class="rmv__layout">
    <div class="rmv__featured">
      <div class="rmv__screen" id="rmv-screen"></div>
      <div class="rmv__caption">
        <div class="rmv__eyebrow"><span class="rmv__dot"></span>RM &amp; CG VIDEO</div>
        <div aria-live="polite" aria-atomic="true"><h3 id="rmv-title"></h3><p class="rmv__description" id="rmv-description"></p></div>
      </div>
    </div>
    <aside aria-label="เลือกวิดีโอ">
      <div class="rmv__list-heading">เลือกชมวิดีโอ <span class="rmv__count">ทั้งหมด 4 คลิป</span></div>
      <ol class="rmv__list" id="rmv-list"></ol>
    </aside>
  </div>
  <noscript>กรุณาเปิด JavaScript เพื่อเลือกชมวิดีโอ</noscript>
</section>
<script>
// แก้ title เป็นชื่อคลิปจริง และใส่ URL ภาพปกใน thumbnail หากมี
// เว้น thumbnail: '' เพื่อใช้กราฟิกสีเขียวที่มีอยู่ในโค้ด
const videos = [
  { id:'634ae928-c7bb-4c6b-ae76-220b90b407ec', title:'วิดีโอแนะนำ 01', description:'เรียนรู้เรื่อง RM & CG ผ่านสื่อวิดีโอเข้าใจง่าย', thumbnail:'' },
  { id:'ae9aa722-18b5-4ea1-99f2-b52ada8d9363', title:'วิดีโอแนะนำ 02', description:'เรียนรู้เรื่อง RM & CG ผ่านสื่อวิดีโอเข้าใจง่าย', thumbnail:'' },
  { id:'f8b19c29-0d1a-4783-be77-2ca451ed1bd3', title:'วิดีโอแนะนำ 03', description:'เรียนรู้เรื่อง RM & CG ผ่านสื่อวิดีโอเข้าใจง่าย', thumbnail:'' },
  { id:'aae2c619-9856-4b5f-aae7-c6dbabf514f8', title:'วิดีโอแนะนำ 04', description:'เรียนรู้เรื่อง RM & CG ผ่านสื่อวิดีโอเข้าใจง่าย', thumbnail:'' }
];
const list = document.getElementById('rmv-list');
let selected = -1;
const buttons = videos.map((video, index) => {
  const li = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'rmv__item';
  button.setAttribute('aria-controls', 'rmv-screen');
  button.setAttribute('aria-label', 'เลือกชม ' + video.title);
  button.innerHTML = '<span class="rmv__thumb"><span class="rmv__play"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1L11 6L2 11Z" fill="currentColor"/></svg></span><span class="rmv__number"></span></span><span><span class="rmv__title"></span><span class="rmv__status"></span></span><span class="rmv__arrow" aria-hidden="true">›</span>';
  button.querySelector('.rmv__title').textContent = video.title;
  button.querySelector('.rmv__number').textContent = String(index + 1).padStart(2,'0');
  if(video.thumbnail){
    const img = new Image(); img.src = video.thumbnail; img.alt = ''; img.loading = 'lazy';
    img.addEventListener('error', () => img.remove());
    button.querySelector('.rmv__thumb').prepend(img);
  }
  button.addEventListener('click', () => selectVideo(index));
  li.append(button); list.append(li);
  return button;
});
function selectVideo(index){
  if(index === selected) return;
  selected = index;
  const video = videos[index];
  const frame = document.createElement('iframe');
  frame.src = 'https://haadthipo365.sharepoint.com/sites/RMCGConnect/_layouts/15/embed.aspx?UniqueId=' + video.id + '&embed=%7B%22ust%22%3Atrue%2C%22hv%22%3A%22CopyEmbedCode%22%7D';
  frame.title = video.title;
  frame.allowFullscreen = true;
  frame.allow = 'fullscreen; picture-in-picture';
  // ถอด player เดิมออกเมื่อเปลี่ยนคลิป เพื่อไม่ให้เสียงเล่นซ้อน
  document.getElementById('rmv-screen').replaceChildren(frame);
  document.getElementById('rmv-title').textContent = video.title;
  document.getElementById('rmv-description').textContent = video.description;
  buttons.forEach((button,i) => {
    button.setAttribute('aria-current', String(i === index));
    button.querySelector('.rmv__status').textContent = i === index ? 'กำลังเลือกชม' : 'เลือกชมวิดีโอ';
  });
}
selectVideo(0);
</script>
</body>
</html>
